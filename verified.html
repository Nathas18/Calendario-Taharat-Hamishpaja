<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#42b8ad'><title>Correo verificado · Calendario Tahará</title><style>:root{--aqua:#42b8ad;--aqua-dark:#167c76;--aqua-deep:#0d5f5a;--aqua-soft:#e9f8f6;--ink:#173634;--muted:#6b817f;--bg:#f4f9f8;--line:#dce9e7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 85% -10%,#dff7f3 0,transparent 30%),var(--bg);color:var(--ink)}.card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 14px 42px rgba(25,93,88,.10);text-align:center}.check{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:var(--aqua-soft);color:var(--aqua-dark);font-size:34px;font-weight:900}h1{margin:0 0 10px;color:var(--aqua-deep);font-size:25px}p{margin:0;color:var(--muted);line-height:1.6;font-size:14px}.btn{display:inline-block;margin-top:22px;padding:12px 18px;border-radius:13px;background:linear-gradient(135deg,var(--aqua-dark),var(--aqua));color:#fff;text-decoration:none;font-weight:800;box-shadow:0 5px 15px rgba(22,124,118,.18)}</style></head><body><main class='card'><div class='check'>✓</div><h1>Correo verificado correctamente</h1><p>Tu cuenta ya quedó confirmada. Ahora puedes regresar al Calendario Tahará e iniciar sesión con tu correo y contraseña.</p><a class='btn' href='./'>Ir a iniciar sesión</a></main></body></html>
